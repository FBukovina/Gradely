name: Android CI

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Android phone and Wear projects
        run: >-
          ./gradlew
          :app:lintDebug
          :app:assembleDebug
          :wear:assembleDebug
          test
          :app:compileDebugAndroidTestKotlin
          :core-data:compileDebugAndroidTestKotlin
          :core-ui:compileDebugAndroidTestKotlin
          :feature-absence:compileDebugAndroidTestKotlin
          :feature-account:compileDebugAndroidTestKotlin
          :feature-auth:compileDebugAndroidTestKotlin
          :feature-gradey-ai:compileDebugAndroidTestKotlin
          :feature-login:compileDebugAndroidTestKotlin
          :feature-stravacz:compileDebugAndroidTestKotlin
          :feature-subjects:compileDebugAndroidTestKotlin
          :feature-timetable:compileDebugAndroidTestKotlin
          :feature-today:compileDebugAndroidTestKotlin
          --stacktrace
