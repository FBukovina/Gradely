name: Windows Build & Tests

on:
  push:
    paths:
      - 'GradelyWindows/**'
      - 'GradelyShared/Fonts/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'GradelyWindows/**'
      - 'GradelyShared/Fonts/**'
      - '.github/workflows/windows-build.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Release solution
        run: dotnet build GradelyWindows/GradelyWindows.sln -c Release

      - name: Run Gradely.Core.Tests
        run: dotnet run --project GradelyWindows/Gradely.Core.Tests/Gradely.Core.Tests.csproj -c Release --no-build
